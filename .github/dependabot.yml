version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint does not yet support the TS 7.x native compiler
      # (tracking: typescript-eslint/typescript-eslint#10940). Hold TS on 6.x
      # until that lands, otherwise `pnpm lint` fails at module load.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
